[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cekurl"
version = "0.1.0"
description = "Pemeriksa keamanan tautan (URL) berbahasa Indonesia"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Hafizd Ammar", email = "hafizdammar@gmail.com"}]

[project.scripts]
cekurl = "cekurl.cli:main"

[tool.setuptools.packages.find]
include = ["cekurl*"]
